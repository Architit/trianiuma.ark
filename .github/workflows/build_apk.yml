name: Build Trianiuma APK

on:
  push:
    branches: [ main, master, ark-gen-phase-0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev \
          libssl-dev libffi-dev libsqlite3-dev \
          ccache

    - name: Install buildozer + cython
      run: pip install --upgrade buildozer cython virtualenv

    - name: Cache buildozer global dir
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Build APK
      run: buildozer -v android debug 2>&1 | tee build.log

    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: trianiuma-apk-${{ github.sha }}
        path: |
          bin/*.apk
          build.log
        retention-days: 14
