name: Build Trianiuma APK

on:
  push:
    branches: [ main, master, ark-gen-phase-0 ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Show spec and structure
      run: |
        echo "=== buildozer.spec (non-comment) ==="
        grep -v "^#" buildozer.spec | grep -v "^$"
        echo "=== repo structure ==="
        ls -la
        echo "=== main.py head ==="
        head -20 main.py || echo "NO main.py!"

    - name: Install system deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev \
          libssl-dev libffi-dev libsqlite3-dev \
          ccache build-essential

    - name: Install buildozer
      run: |
        pip install --upgrade pip wheel
        pip install cython==0.29.37
        pip install buildozer==1.5.0
        buildozer version

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-v2-${{ hashFiles('buildozer.spec') }}

    - name: Build APK
      run: |
        export ANDROIDAPI=33
        export ANDROIDMINAPI=21
        buildozer -v android debug 2>&1 | tee build.log
      continue-on-error: true

    - name: Show results
      if: always()
      run: |
        echo "=== BIN DIR ==="
        ls -lah bin/ 2>/dev/null || echo "EMPTY"
        echo "=== LAST 100 LINES LOG ==="
        tail -100 build.log 2>/dev/null || echo "NO LOG"

    - name: Upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trianiuma-build-${{ github.run_number }}
        path: |
          bin/
          build.log
        retention-days: 14
