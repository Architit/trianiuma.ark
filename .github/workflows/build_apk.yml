name: Build Trianiuma APK

on:
  push:
    branches: [ main, master, ark-gen-phase-0 ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev \
          libssl-dev libffi-dev libsqlite3-dev \
          ccache build-essential

    - name: Install buildozer
      run: |
        pip install --upgrade pip wheel
        pip install cython==0.29.37
        pip install buildozer==1.5.0

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-v3-${{ hashFiles('buildozer.spec') }}

    - name: Pre-accept ALL Android SDK licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
          > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" \
          >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d975f751698a77b662f1254ddbeed3901e976f5a" \
          > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo "601085b94cd77f0b54ff86406957099ebe79c4d6" \
          >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK
      run: |
        buildozer -v android debug 2>&1 | tee build.log
      continue-on-error: true

    - name: Show results
      if: always()
      run: |
        echo "=== BIN ==="
        ls -lah bin/ 2>/dev/null || echo "EMPTY"
        echo "=== TAIL LOG ==="
        tail -30 build.log

    - name: Upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trianiuma-build-${{ github.run_number }}
        path: |
          bin/
          build.log
        retention-days: 14
