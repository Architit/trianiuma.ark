name: Build Trianiuma APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libssl-dev libffi-dev libsqlite3-dev
        pip install --upgrade buildozer cython

    - name: Build APK
      run: |
        cd trianiuma.ark || cd .
        buildozer android debug 2>&1 | tee build.log

    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: trianiuma-apk
        path: |
          bin/*.apk
          bin/*.aab
        retention-days: 7

    - name: Upload to OneDrive via rclone
      if: success()
      env:
        RCLONE_ONEDRIVE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
      run: |
        curl https://rclone.org/install.sh | bash
        mkdir -p ~/.config/rclone
        echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
        rclone copy bin/ onedrive:RADRILONIUMA_PROJECT/builds/ --include "*.apk"
